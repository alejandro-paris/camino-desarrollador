    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime:wght@400;700&display=swap');

      :root {
        --crt-scanline: rgba(18, 16, 16, 0.1);
        --neon-green: #39ff14;
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: #050505;
        color: #39ff14;
        font-family: 'Courier Prime', 'Courier New', monospace;
        touch-action: none;
      }

      /* CRT Effect Overlay */

      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        z-index: 9999;
        pointer-events: none;
        animation: scanline 10s linear infinite;
      }

      .glow-text {
        text-shadow: 0 0 5px rgba(57, 255, 20, 0.5), 0 0 10px rgba(57, 255, 20, 0.3);
      }

      canvas {
        display: block;
      }

      /* Retro Scrollbar */

      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: #000; 
      }

      ::-webkit-scrollbar-thumb {
        background: #39ff14; 
        border: 1px solid #000;
      }
    </style>
